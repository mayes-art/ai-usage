<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 用量</title>
<style>
  :root {
    --bg: #101419;
    --surface: #161B22;
    --rule: #232B36;
    --rule-strong: #33404F;
    --text: #E4E9F0;
    --text-dim: #93A0B1;
    --text-faint: #667484;
    --accent: #3F72C4;
    --accent-soft: #23405F;
    --warn: #C08A2C;
    --crit: #BC4258;
    --track: #1D242D;
    --radius: 3px;
    --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system,
            "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #EFF2F1;
      --surface: #FFFFFF;
      --rule: #E0E5E5;
      --rule-strong: #C3CCCC;
      --text: #191E24;
      --text-dim: #5C6875;
      --text-faint: #8996A3;
      --accent: #2F5FAC;
      --accent-soft: #D6E1F2;
      --warn: #9A6B12;
      --crit: #A5344A;
      --track: #E7EBEA;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }
  .panel {
    max-width: 680px;
    margin: 0 auto;
    padding: 18px 20px 28px;
  }

  header {
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--rule-strong);
  }
  h1 {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: .01em;
    margin: 0;
  }
  .clock {
    margin-left: auto;
    font-size: 12px;
    color: var(--text-faint);
  }
  button {
    font-family: inherit;
    font-size: 12px;
    color: var(--text-dim);
    background: transparent;
    border: 1px solid var(--rule-strong);
    border-radius: var(--radius);
    padding: 3px 9px;
    cursor: pointer;
  }
  button:hover { color: var(--text); border-color: var(--text-faint); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .row {
    padding: 15px 0 13px;
    border-bottom: 1px solid var(--rule);
  }
  .row:last-child { border-bottom: 0; }

  /* 標題列：左邊是身分，右邊是百分比。百分比是這個面板的主詞。 */
  .head {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 9px;
  }
  .dot {
    width: 6px; height: 6px;
    flex: 0 0 auto;
    margin-top: 7px;
    background: var(--accent);
  }
  .dot.idle { background: var(--text-faint); }
  .dot.warn { background: var(--warn); }
  .dot.crit { background: var(--crit); }
  .dot.off  { background: transparent; box-shadow: inset 0 0 0 1px var(--text-faint); }

  .title { min-width: 0; }
  .name { font-weight: 600; font-size: 14px; }
  .window { font-size: 12px; color: var(--text-faint); }

  .readout {
    margin-left: auto;
    text-align: right;
    flex: 0 0 auto;
    padding-left: 12px;
  }
  /* 百分比：整個版面裡唯一的大字。 */
  .pct {
    font-size: 30px;
    font-weight: 600;
    line-height: 1.05;
    letter-spacing: -.02em;
    color: var(--accent);
  }
  .pct .sign {
    font-size: 15px;
    font-weight: 500;
    margin-left: 1px;
    color: var(--text-dim);
  }
  .pct.warn { color: var(--warn); }
  .pct.crit { color: var(--crit); }
  .pct.none { color: var(--text-faint); font-weight: 500; font-size: 20px; line-height: 1.6; }
  /* 用量與總量退居第二行，仍然看得到，但不再是第一眼的東西。 */
  .amounts {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 1px;
    white-space: nowrap;
  }
  .amounts .sep { color: var(--text-faint); margin: 0 3px; }
  .amounts .unit { color: var(--text-faint); }

  /* 細長條：數字已經是主角，條只負責讓比例一眼可見，所以做到最薄。 */
  .track {
    position: relative;
    height: 4px;
    margin: 2px 0 1px;
    background: var(--track);
    border-radius: 999px;
    overflow: hidden;
  }
  .fill {
    height: 100%;
    width: 0;
    background: var(--accent);
    border-radius: 999px;
    transition: width .35s ease;
  }
  .fill.warn { background: var(--warn); }
  .fill.crit { background: var(--crit); }
  /* 警戒線用背景色，蓋在填色上也看得見 */
  .marker {
    position: absolute; top: 0; bottom: 0;
    width: 1px;
    background: var(--bg);
    opacity: .7;
  }
  .track.unset {
    background: repeating-linear-gradient(135deg,
      var(--track) 0, var(--track) 3px,
      transparent 3px, transparent 6px);
    box-shadow: inset 0 0 0 1px var(--rule);
  }
  @media (prefers-reduced-motion: reduce) {
    .fill { transition: none; }
  }

  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 18px;
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-dim);
  }
  /* 每一則是一個不可拆的單位，換行時標籤不會跟數值分家 */
  .meta .bit { white-space: nowrap; }
  .meta b { font-weight: 500; color: var(--text); }
  .meta .label { color: var(--text-faint); margin-right: 4px; }
  .meta.alert { color: var(--warn); }
  .meta.alert b { color: var(--warn); }
  .meta.over, .meta.over b { color: var(--crit); }

  .models {
    margin-top: 7px;
    font-size: 12px;
    color: var(--text-faint);
    display: flex;
    flex-wrap: wrap;
    gap: 3px 14px;
  }

  form.limit {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 9px;
    font-size: 12px;
    color: var(--text-dim);
  }
  /* 沒有分母就沒有百分比，所以把設定上限做成明顯的下一步。 */
  form.limit button.cta {
    color: var(--text);
    border-color: var(--accent);
  }
  form.limit button.cta:hover { background: var(--accent-soft); }
  input[type=number], input[type=text] {
    font-family: inherit;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    width: 92px;
    padding: 3px 6px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--rule-strong);
    border-radius: var(--radius);
  }
  input:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }

  .hint {
    margin-top: 6px;
    font-size: 12px;
    color: var(--text-faint);
    flex-basis: 100%;
  }
  .path {
    font-size: 11px;
    color: var(--text-faint);
    word-break: break-all;
  }
  footer {
    margin-top: 18px;
    padding-top: 12px;
    border-top: 1px solid var(--rule);
    font-size: 11px;
    color: var(--text-faint);
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }
  a { color: var(--text-dim); }

  @media (max-width: 420px) {
    .pct { font-size: 26px; }
    .amounts { font-size: 11px; }
  }
</style>
</head>
<body>
<div class="panel">
  <header>
    <h1>AI 用量</h1>
    <span class="clock" id="clock">連線中</span>
    <button id="rescan" title="清掉讀取位移並重新掃描所有紀錄">重新掃描</button>
  </header>

  <div id="rows"></div>

  <footer>
    <span id="host"></span>
    <span id="scan"></span>
    <span>資料只留在這台電腦，不會上傳</span>
  </footer>
</div>

<script>
const rowsEl = document.getElementById('rows');
const clockEl = document.getElementById('clock');
let latest = null;
let editing = null;   // 正在編輯的來源 id，避免重繪打斷輸入

function fmtNum(n, metric) {
  if (metric === 'requests') return Math.round(n).toLocaleString('zh-Hant');
  if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e4) return (n / 1e3).toFixed(1) + 'k';
  if (n >= 1000) return (n / 1e3).toFixed(2) + 'k';
  return Math.round(n).toLocaleString('zh-Hant');
}
// 百分比的位數隨大小調整：接近滿的時候整數就夠，剛開始用的時候
// 一位小數才看得出有沒有在動。
function fmtPct(ratio) {
  const v = ratio * 100;
  if (v >= 10) return String(Math.round(v));
  if (v >= 1) return v.toFixed(1);
  if (v > 0) return '<1';
  return '0';
}
function fmtClock(unix) {
  return new Date(unix * 1000).toLocaleTimeString('zh-Hant', { hour12: false });
}
function fmtLeft(sec) {
  if (sec < 0) sec = 0;
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
  if (h > 24) return Math.floor(h / 24) + ' 天 ' + (h % 24) + ' 小時';
  if (h > 0) return h + ' 小時 ' + m + ' 分';
  if (m > 0) return m + ' 分';
  return Math.floor(sec) + ' 秒';
}
function metricWord(metric) { return metric === 'requests' ? '次' : 'tokens'; }

function render(snap) {
  latest = snap;
  clockEl.textContent = '更新於 ' + fmtClock(snap.at);
  document.getElementById('host').textContent = snap.host;
  document.getElementById('scan').textContent = '掃描 ' + snap.scan_ms + ' ms';

  const now = snap.at;
  rowsEl.innerHTML = '';
  for (const p of snap.providers) {
    rowsEl.appendChild(buildRow(p, now, editing === p.id));
  }
}

function buildRow(p, now, keepEditor) {
  const row = document.createElement('div');
  row.className = 'row';

  // has_limit 由後端決定：可能是手動上限，也可能是紀錄裡的官方回報百分比。
  const hasLimit = !!p.has_limit;
  let level = '';
  if (hasLimit && p.percent >= 1) level = 'crit';
  else if (hasLimit && p.percent >= p.warn_ratio) level = 'warn';

  let dotClass = 'dot';
  if (p.status === 'ok' || p.status === 'manual') dotClass += ' ' + (level || '');
  else if (p.status === 'idle') dotClass += ' idle';
  else dotClass += ' off';

  // 標題列：百分比是主角，用量／總量是它的註腳
  const head = document.createElement('div');
  head.className = 'head';
  head.innerHTML =
    '<span class="' + dotClass + '"></span>' +
    '<div class="title">' +
      '<div class="name"></div>' +
      '<div class="window"></div>' +
    '</div>' +
    '<div class="readout">' +
      '<div class="pct"></div>' +
      '<div class="amounts"></div>' +
    '</div>';
  head.querySelector('.name').textContent = p.name;
  head.querySelector('.window').textContent = p.window_label;

  const pctEl = head.querySelector('.pct');
  const amtEl = head.querySelector('.amounts');
  if (hasLimit) {
    pctEl.className = 'pct ' + level;
    pctEl.innerHTML = fmtPct(p.percent) + '<span class="sign">%</span>';
    pctEl.title = '用量 ÷ 總量';
  } else {
    pctEl.className = 'pct none';
    // 保留 % 記號，讓這個位置一眼看得出是「百分比還算不出來」，
    // 而不是一條莫名其妙的橫線。
    pctEl.innerHTML = '—<span class="sign">%</span>';
    pctEl.title = '尚未設定上限，算不出百分比';
  }

  const used = fmtNum(p.used, p.metric);
  const unit = metricWord(p.metric);
  if (hasLimit && p.show_limit) {
    amtEl.innerHTML = escapeHtml(used) + '<span class="sep">/</span>' +
      escapeHtml(fmtNum(p.limit, p.metric)) + ' <span class="unit">' + unit + '</span>';
  } else if (hasLimit) {
    // 官方只回報百分比、沒給絕對上限。這裡的數字是我們自己數的 token，
    // 跟上面那個百分比不是同一個單位，所以要講清楚是本機統計。
    amtEl.innerHTML = '<span class="unit">本機累計</span> ' + escapeHtml(used) +
      ' <span class="unit">' + unit + '</span>';
  } else {
    amtEl.innerHTML = escapeHtml(used) + ' <span class="unit">' + unit + '，尚未設定上限</span>';
  }
  row.appendChild(head);

  // 進度條
  const track = document.createElement('div');
  track.className = 'track' + (hasLimit ? '' : ' unset');
  if (hasLimit) {
    const fill = document.createElement('div');
    fill.className = 'fill ' + level;
    fill.style.width = Math.min(p.percent * 100, 100) + '%';
    track.appendChild(fill);
    const marker = document.createElement('div');
    marker.className = 'marker';
    marker.style.left = (p.warn_ratio * 100) + '%';
    marker.title = '警戒線 ' + Math.round(p.warn_ratio * 100) + '%';
    track.appendChild(marker);
  }
  row.appendChild(track);

  // 下方資訊列
  const meta = document.createElement('div');
  meta.className = 'meta';
  const bits = [];

  const bit = (label, value) =>
    bits.push('<span class="bit"><span class="label">' + escapeHtml(label) + '</span><b>' + value + '</b></span>');

  if (hasLimit && p.percent > 1) {
    bit('已超出上限', fmtPct(p.percent - 1) + '%');
  } else if (hasLimit) {
    bit('剩餘', fmtPct(1 - p.percent) + '%' +
      (p.show_limit ? '（' + fmtNum(Math.max(p.limit - p.used, 0), p.metric) + ' ' + unit + '）' : ''));
  }
  if (p.reset_at) bit(p.reset_label, fmtLeft(p.reset_at - now) + '後');
  if (p.rate_per_min > 0) bit('速率', fmtNum(p.rate_per_min * 60, p.metric) + ' / 小時');
  if (p.exhaust_in_sec) bit('依此速率', fmtLeft(p.exhaust_in_sec) + '後達 100%');
  if (p.today > 0 && p.window_label.indexOf('今日') < 0) {
    bit('今日', fmtNum(p.today, p.metric) + ' ' + unit);
  }
  // 另一道限制（例如 Codex 的 7 天窗）。進度條只畫得下一個，其餘放這裡。
  if (p.other_limits) {
    for (const w of p.other_limits) {
      let v = fmtPct(w.percent) + '%';
      if (w.reset_at) v += '，' + fmtLeft(w.reset_at - now) + '後重置';
      bit((w.label || '另一道') + '限額', v);
    }
  }
  if (p.limit_source === 'reported') bit('分母', '紀錄中的官方回報值');
  if (bits.length) {
    meta.innerHTML = bits.join('');
    if (level === 'crit') meta.className = 'meta over';
    else if (level) meta.className = 'meta alert';
    row.appendChild(meta);
  }

  // 模型分佈
  if (p.models && p.models.length && p.status === 'ok') {
    const m = document.createElement('div');
    m.className = 'models';
    m.innerHTML = p.models.map(x =>
      '<span>' + escapeHtml(x.model) + ' ' + fmtNum(p.metric === 'requests' ? x.requests : x.tokens, p.metric) + '</span>'
    ).join('');
    row.appendChild(m);
  }

  // 狀態說明與可操作的下一步
  if (p.status === 'unavailable') {
    const h = document.createElement('div');
    h.className = 'hint';
    h.innerHTML = '找不到紀錄資料夾。確認這些路徑是否存在，或改設定檔後按重新掃描：' +
      '<div class="path">' + p.roots.map(escapeHtml).join('<br>') + '</div>';
    row.appendChild(h);
  } else if (p.status === 'no_data' || p.status === 'idle' || p.status === 'disabled') {
    const h = document.createElement('div');
    h.className = 'hint';
    h.textContent = p.detail + (p.files ? '（已讀 ' + p.files + ' 個檔案）' : '');
    row.appendChild(h);
  }
  if (p.errors && p.errors.length) {
    const h = document.createElement('div');
    h.className = 'hint';
    h.textContent = '讀取問題：' + p.errors[0];
    row.appendChild(h);
  }

  // 上限設定
  row.appendChild(buildLimitForm(p, keepEditor, hasLimit));
  return row;
}

function buildLimitForm(p, keepEditor, hasLimit) {
  const wrap = document.createElement('form');
  wrap.className = 'limit';
  wrap.onsubmit = e => e.preventDefault();

  const manualSource = p.id === 'cursor';

  if (!keepEditor) {
    const btn = document.createElement('button');
    btn.type = 'button';
    if (p.limit_source === 'unset') {
      btn.textContent = manualSource ? '填入後台看到的數字' : '設定上限';
      if (!hasLimit) btn.className = 'cta';
    } else if (p.limit_source === 'reported') {
      btn.textContent = '改用手動上限';
    } else {
      btn.textContent = '調整上限';
    }
    btn.onclick = () => { editing = p.id; render(latest); };
    wrap.appendChild(btn);
    if (!hasLimit && !manualSource) {
      const s = document.createElement('span');
      s.textContent = '填入上限後這裡就會顯示百分比';
      wrap.appendChild(s);
    }
    if (p.note && p.limit_source === 'unset') {
      const n = document.createElement('div');
      n.className = 'hint';
      n.textContent = p.note;
      wrap.appendChild(n);
    }
    return wrap;
  }

  const usedInput = document.createElement('input');
  usedInput.type = 'number';
  usedInput.min = '0';
  usedInput.placeholder = '已用';
  usedInput.value = manualSource && p.used ? p.used : '';

  const limitInput = document.createElement('input');
  limitInput.type = 'number';
  limitInput.min = '0';
  limitInput.placeholder = '上限（' + metricWord(p.metric) + '）';
  limitInput.value = p.limit || '';

  if (manualSource) {
    const l1 = document.createElement('span'); l1.textContent = '已用';
    wrap.appendChild(l1); wrap.appendChild(usedInput);
  }
  const l2 = document.createElement('span'); l2.textContent = '上限';
  wrap.appendChild(l2); wrap.appendChild(limitInput);

  const save = document.createElement('button');
  save.type = 'button';
  save.textContent = '儲存';
  save.onclick = async () => {
    const body = { provider: p.id, limit: Number(limitInput.value) || 0 };
    if (manualSource) body.used = Number(usedInput.value) || 0;
    await fetch('api/limit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    editing = null;
    refresh();
  };
  wrap.appendChild(save);

  const cancel = document.createElement('button');
  cancel.type = 'button';
  cancel.textContent = '取消';
  cancel.onclick = () => { editing = null; render(latest); };
  wrap.appendChild(cancel);

  limitInput.addEventListener('keydown', e => { if (e.key === 'Enter') save.click(); });
  usedInput.addEventListener('keydown', e => { if (e.key === 'Enter') save.click(); });
  setTimeout(() => (manualSource ? usedInput : limitInput).focus(), 0);
  return wrap;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

async function refresh() {
  try {
    const r = await fetch('api/snapshot');
    render(await r.json());
  } catch (e) {
    clockEl.textContent = '連線中斷';
  }
}

document.getElementById('rescan').onclick = async () => {
  clockEl.textContent = '重新掃描中';
  await fetch('api/rescan', { method: 'POST' });
  setTimeout(refresh, 600);
};

// 即時更新：SSE 斷線就退回輪詢
function connect() {
  const es = new EventSource('api/stream');
  es.onmessage = e => {
    if (editing) return;          // 使用者正在輸入，先不重繪
    render(JSON.parse(e.data));
  };
  es.onerror = () => {
    es.close();
    clockEl.textContent = '重新連線中';
    setTimeout(connect, 3000);
  };
}
refresh();
connect();
</script>
</body>
</html>
