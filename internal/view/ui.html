<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 用量</title>
<link rel="icon" type="image/png" sizes="64x64" href="/robot-icon.png?v=1">
<style>
  :root {
    --bg: #101419;
    --surface: #161B22;
    --rule: #232B36;
    --rule-strong: #33404F;
    --text: #E4E9F0;
    --text-dim: #93A0B1;
    --text-faint: #667484;
    --accent: #3F72C4;
    --accent-soft: #23405F;
    --warn: #C08A2C;
    --crit: #BC4258;
    --track: #1D242D;
    --radius: 3px;
    --font: "Segoe UI", "Microsoft JhengHei UI", "Microsoft JhengHei",
            system-ui, -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #EFF2F1;
      --surface: #FFFFFF;
      --rule: #E0E5E5;
      --rule-strong: #C3CCCC;
      --text: #191E24;
      --text-dim: #5C6875;
      --text-faint: #8996A3;
      --accent: #2F5FAC;
      --accent-soft: #D6E1F2;
      --warn: #9A6B12;
      --crit: #A5344A;
      --track: #E7EBEA;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.45;
    font-weight: 500;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }
  .panel {
    max-width: 680px;
    margin: 0 auto;
    padding: 18px 20px 28px;
  }

  header {
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--rule-strong);
  }
  .clock {
    margin-left: auto;
    font-size: 12px;
    color: var(--text-faint);
  }
  button {
    font-family: inherit;
    font-size: 12px;
    color: var(--text-dim);
    background: transparent;
    border: 1px solid var(--rule-strong);
    border-radius: var(--radius);
    padding: 3px 9px;
    cursor: pointer;
  }
  button:hover { color: var(--text); border-color: var(--text-faint); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .row {
    padding: 15px 0 13px;
    border-bottom: 1px solid var(--rule);
  }
  .row:last-child { border-bottom: 0; }

  /* 標題列：左邊是身分，右邊是百分比。百分比是這個面板的主詞。 */
  .head {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 9px;
  }
  .provider-icon {
    width: 17px; height: 17px;
    flex: 0 0 auto;
    margin-top: 1px;
    color: var(--agent);
  }
  .provider-icon svg { display: block; width: 100%; height: 100%; }
  .provider-icon img { display: block; width: 100%; height: 100%; object-fit: contain; }
  .provider-icon.off { color: var(--text-faint); opacity: .72; }

  .title { min-width: 0; flex: 1 1 auto; }
  .title-line { display: flex; align-items: baseline; gap: 5px; min-width: 0; }
  .name { font-weight: 600; font-size: 14px; }
  .reset-countdown {
    color: var(--text-dim);
    font-size: 12px;
    white-space: nowrap;
  }
  .reset-countdown.unknown { color: var(--text-faint); }
  .window { font-size: 12px; color: var(--text-faint); }

  .readout {
    margin-left: auto;
    text-align: right;
    flex: 0 0 auto;
    padding-left: 12px;
  }
  /* 百分比：整個版面裡唯一的大字。 */
  .pct {
    font-size: 30px;
    font-weight: 600;
    line-height: 1.05;
    letter-spacing: -.02em;
    color: var(--accent);
  }
  .pct .sign {
    font-size: 15px;
    font-weight: 500;
    margin-left: 1px;
    color: var(--text-dim);
  }
  .pct.warn { color: var(--warn); }
  .pct.crit { color: var(--crit); }
  .pct.none { color: var(--text-faint); font-weight: 500; font-size: 20px; line-height: 1.6; }
  /* 用量與總量退居第二行，仍然看得到，但不再是第一眼的東西。 */
  .amounts {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 1px;
    white-space: nowrap;
  }
  .amounts .sep { color: var(--text-faint); margin: 0 3px; }
  .amounts .unit { color: var(--text-faint); }

  /* 細長條：數字已經是主角，條只負責讓比例一眼可見，所以做到最薄。 */
  .track {
    position: relative;
    height: 4px;
    margin: 2px 0 1px;
    background: var(--track);
    border-radius: 999px;
    overflow: hidden;
  }
  .fill {
    height: 100%;
    width: 0;
    background: var(--accent);
    border-radius: 999px;
    transition: width .35s ease;
  }
  .fill.warn { background: var(--warn); }
  .fill.crit { background: var(--crit); }
  /* 警戒線用背景色，蓋在填色上也看得見 */
  .marker {
    position: absolute; top: 0; bottom: 0;
    width: 1px;
    background: var(--bg);
    opacity: .7;
  }
  .track.unset {
    background: repeating-linear-gradient(135deg,
      var(--track) 0, var(--track) 3px,
      transparent 3px, transparent 6px);
    box-shadow: inset 0 0 0 1px var(--rule);
  }
  @media (prefers-reduced-motion: reduce) {
    .fill { transition: none; }
  }

  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 18px;
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-dim);
  }
  /* 每一則是一個不可拆的單位，換行時標籤不會跟數值分家 */
  .meta .bit { white-space: nowrap; }
  .meta b { font-weight: 500; color: var(--text); }
  .meta .label { color: var(--text-faint); margin-right: 4px; }
  .meta.alert { color: var(--warn); }
  .meta.alert b { color: var(--warn); }
  .meta.over, .meta.over b { color: var(--crit); }

  .models {
    margin-top: 7px;
    font-size: 12px;
    color: var(--text-faint);
    display: flex;
    flex-wrap: wrap;
    gap: 3px 14px;
  }

  form.limit {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 9px;
    font-size: 12px;
    color: var(--text-dim);
  }
  /* 沒有分母就沒有百分比，所以把設定上限做成明顯的下一步。 */
  form.limit button.cta {
    color: var(--text);
    border-color: var(--accent);
  }
  form.limit button.cta:hover { background: var(--accent-soft); }
  input[type=number], input[type=text] {
    font-family: inherit;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    width: 92px;
    padding: 3px 6px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--rule-strong);
    border-radius: var(--radius);
  }
  input:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }

  .hint {
    margin-top: 6px;
    font-size: 12px;
    color: var(--text-faint);
    flex-basis: 100%;
  }
  .path {
    font-size: 11px;
    color: var(--text-faint);
    word-break: break-all;
  }
  footer {
    margin-top: 18px;
    padding-top: 12px;
    border-top: 1px solid var(--rule);
    font-size: 11px;
    color: var(--text-faint);
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }
  a { color: var(--text-dim); }

  @media (max-width: 420px) {
    .pct { font-size: 26px; }
    .amounts { font-size: 11px; }
  }
</style>
<style>
  /* backdrop-filter 只採樣頁面自己的背景，所以底下那層漸層就是玻璃要糊的東西。 */
  :root {
    --glass-fill: rgba(255, 255, 255, .10);
    --glass-fill-2: rgba(255, 255, 255, .035);
    --glass-edge: rgba(255, 255, 255, .20);
    --glass-shine: rgba(255, 255, 255, .42);
    --glass-shadow: rgba(0, 0, 0, .34);
    --glass-hover: rgba(255, 255, 255, .16);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --glass-fill: rgba(255, 255, 255, .58);
      --glass-fill-2: rgba(255, 255, 255, .30);
      --glass-edge: rgba(255, 255, 255, .80);
      --glass-shine: rgba(255, 255, 255, .95);
      --glass-shadow: rgba(30, 41, 59, .14);
      --glass-hover: rgba(255, 255, 255, .74);
    }
  }

  html, body { height: 100%; }
  body {
    font-size: 14px;
    line-height: 1.4;
    font-weight: 500;
    background:
      radial-gradient(760px 340px at 4% -20%, rgba(96, 140, 255, .34), transparent 62%),
      radial-gradient(620px 300px at 46% 128%, rgba(186, 118, 255, .26), transparent 64%),
      radial-gradient(640px 320px at 102% 8%, rgba(72, 208, 200, .24), transparent 60%),
      var(--bg);
    background-attachment: fixed;
  }
  @media (prefers-color-scheme: light) {
    body {
      background:
        radial-gradient(760px 340px at 4% -20%, rgba(96, 140, 255, .26), transparent 62%),
        radial-gradient(620px 300px at 46% 128%, rgba(186, 118, 255, .20), transparent 64%),
        radial-gradient(640px 320px at 102% 8%, rgba(72, 208, 200, .18), transparent 60%),
        var(--bg);
    }
  }

  .panel { width: 100%; max-width: none; margin: 0; padding: 8px 10px 7px; cursor: grab; }
  .panel:active { cursor: grabbing; }
  .details, .details * { cursor: auto; }
  button { cursor: pointer; }
  input, textarea { cursor: text; }

  header {
    gap: 8px;
    align-items: center;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--glass-edge);
  }
  .clock { font-size: 11px; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; margin-left: 0; }
  .window-controls { display: flex; gap: 2px; margin-left: auto; flex: 0 0 auto; }
  button.icon {
    width: 22px; height: 22px;
    display: grid; place-items: center;
    padding: 0;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--text-dim);
  }
  button.icon svg { width: 15px; height: 15px; display: block; }
  button.icon:hover { background: var(--glass-hover); color: var(--text); }
  button {
    border-color: var(--glass-edge);
    background: var(--glass-fill-2);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 999px;
    font-size: 11px;
  }
  button:hover { background: var(--glass-hover); }

  #rows {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 8px;
  }
  .row {
    position: relative;
    flex: 0 0 auto;
    min-width: 0;
    margin: 0;
    padding: 9px 11px 8px;
    border: 1px solid var(--glass-edge);
    border-radius: 15px;
    background: linear-gradient(152deg, var(--glass-fill), var(--glass-fill-2));
    backdrop-filter: blur(22px) saturate(168%);
    -webkit-backdrop-filter: blur(22px) saturate(168%);
    box-shadow: 0 7px 20px var(--glass-shadow), inset 0 1px 0 var(--glass-shine);
    transition: background .18s ease, transform .18s ease, box-shadow .18s ease;
  }
  .row:last-child { border-bottom: 1px solid var(--glass-edge); }
  .row.expanded { background: linear-gradient(152deg, var(--glass-hover), var(--glass-fill)); }
  .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .row:hover {
    background: linear-gradient(152deg, var(--glass-hover), var(--glass-fill));
    transform: translateY(-1px);
    box-shadow: 0 10px 24px var(--glass-shadow), inset 0 1px 0 var(--glass-shine);
  }
  /* 折射邊：漸層描邊只留在 1px 的框上，模擬玻璃邊緣的高光。 */
  .row::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(150deg, var(--glass-shine), transparent 36%,
      transparent 64%, var(--glass-edge));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
    opacity: .6;
    pointer-events: none;
  }
  .row > * { position: relative; }

  .head { flex-wrap: wrap; align-items: center; gap: 5px; margin-bottom: 1px; }
  .provider-icon { width: 16px; height: 16px; margin-top: 0; }
  .title { flex: 1 1 auto; }
  .title-line { gap: 4px; }
  .name { font-size: 13px; }
  .reset-countdown { font-size: 11px; }
  .window { display: none; }
  .readout { flex: 1 1 100%; margin-left: 0; padding-left: 0; text-align: left; }
  .pct { font-size: 26px; color: var(--agent); line-height: 1.1; }
  .pct.none { font-size: 19px; line-height: 1.5; }
  .pct .sign { font-size: 13px; }
  .track { height: 5px; margin: 3px 0 0; background: rgba(128, 138, 152, .28); }
  .fill, .fill.warn, .fill.crit { background: var(--agent); }
  .fill.warn { background: var(--warn); }
  .fill.crit { background: var(--crit); }
  .marker { background: var(--glass-shine); opacity: .55; }
  .amounts {
    margin-top: 4px;
    font-size: 11px;
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .details {
    margin-top: 7px;
    padding-top: 6px;
    border-top: 1px solid var(--glass-edge);
  }
  .details[hidden] { display: none; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; }
  .meta .bit { white-space: normal; overflow-wrap: anywhere; }
  .models { font-size: 11px; }
  form.limit, input[type=number], input[type=text] { font-size: 12px; }
  .hint { font-size: 12px; }
  .path { font-size: 11px; }
  input[type=number], input[type=text] {
    background: var(--glass-fill-2);
    border-color: var(--glass-edge);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .usage-groups { margin: 6px 0 0; padding-left: 0; border-left: 0; }
  .usage-group + .usage-group { margin-top: 4px; }
  .group-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; font-size: 11px; }
  .group-percent { font-size: 12px; font-weight: 600; color: var(--agent); }
  .group-percent.warn { color: var(--warn); }
  .group-percent.crit { color: var(--crit); }
  .group-percent.none { color: var(--text-faint); }
  .usage-group .fill.warn { background: var(--warn); }
  .usage-group .fill.crit { background: var(--crit); }
  .usage-group .track { height: 4px; margin-top: 2px; }
  .usage-group .group-note { display: none; }
  .usage-groups > .group-note { font-size: 11px; color: var(--text-faint); margin-top: 4px; }

  footer {
    margin-top: 7px;
    padding-top: 5px;
    border-top: 1px solid var(--glass-edge);
    font-size: 11px;
    gap: 2px 10px;
  }
  footer > span {
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* flex-wrap 用縮小前的尺寸決定換行，basis 要是 0 才不會把掃描時間擠到下一行。 */
  #host { flex: 1 1 0; }
  #scan { flex: 0 1 auto; }
  footer > span:last-child { flex: 1 0 100%; }
  .empty { color: var(--text-dim); padding: 24px 8px; text-align: center; }
  @media (prefers-reduced-motion: reduce) {
    .row, .row:hover { transition: none; transform: none; }
  }
</style>
</head>

<div class="panel">
  <header>
    <span class="clock" id="clock">連線中</span>
    <div class="window-controls">
      <button id="rescan" class="icon" title="重新掃描：清掉讀取位移並重新掃描所有紀錄" aria-label="重新掃描">

    <span id="scan"></span>

</div>

let editing = null;   // 正在編輯的來源 id，避免重繪打斷輸入

function fmtNum(n, metric) {
  if (metric === 'usd') return Number(n).toFixed(2);
  if (metric === 'requests') return Math.round(n).toLocaleString('zh-Hant');
  if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e4) return (n / 1e3).toFixed(1) + 'k';
  if (n >= 1000) return (n / 1e3).toFixed(2) + 'k';
  return Math.round(n).toLocaleString('zh-Hant');
}
// 百分比的位數隨大小調整：接近滿的時候整數就夠，剛開始用的時候
// 一位小數才看得出有沒有在動。
function fmtPct(ratio) {
  const v = ratio * 100;
  if (v >= 10) return String(Math.round(v));
  if (v >= 1) return v.toFixed(1);
  if (v > 0) return '<1';
  return '0';
}
function fmtClock(unix) {
  return new Date(unix * 1000).toLocaleTimeString('zh-Hant', { hour12: false });
}
function fmtLeft(sec) {
  if (sec < 0) sec = 0;
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
  if (h > 24) return Math.floor(h / 24) + ' 天 ' + (h % 24) + ' 小時';
  if (h > 0) return h + ' 小時 ' + m + ' 分';
  if (m > 0) return m + ' 分';
  return Math.floor(sec) + ' 秒';
}
function metricWord(metric) { return metric === 'usd' ? 'USD' : metric === 'requests' ? '次' : 'tokens'; }

function providerIcon(id, off) {
  const cursorCube = '<svg viewBox="400 395 167 190" aria-hidden="true"><path fill="currentColor" d="M563.463 439.971 487.344 396.057a7.91 7.91 0 0 0-7.905 0l-76.116 43.914a6.64 6.64 0 0 0-3.323 5.752v88.553a6.64 6.64 0 0 0 3.323 5.753l76.12 43.914a7.91 7.91 0 0 0 7.904 0l76.119-43.914a6.64 6.64 0 0 0 3.324-5.753v-88.553a6.64 6.64 0 0 0-3.324-5.752h-.003Zm-4.782 9.302-73.482 127.178c-.496.857-1.808.507-1.808-.485v-83.275a4.68 4.68 0 0 0-2.333-4.039l-72.171-41.636c-.857-.496-.507-1.807.486-1.807h146.964c2.087 0 3.391 2.261 2.348 4.067h-.004v-.003Z"/></svg>';
  const content = officialIconImages[id]
    ? '<img src="' + officialIconImages[id] + '" alt="">'
    : id === 'cursor' ? cursorCube
    : '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>';
  return '<span class="provider-icon' + (off ? ' off' : '') + '">' +
    content + '</span>';
}
function fmtCountdown(sec) {
  sec = Math.max(0, Math.floor(sec));
  const days = Math.floor(sec / 86400);
  const hours = Math.floor((sec % 86400) / 3600);
  const minutes = Math.floor((sec % 3600) / 60);
  const seconds = sec % 60;
  const two = n => String(n).padStart(2, '0');
  if (days > 0) return days + '天 ' + two(hours) + ':' + two(minutes);
  return hours + ':' + two(minutes) + ':' + two(seconds);
}

function countdownValue(unix, dueText) {
  const left = unix - Date.now() / 1000;
  return left <= 0 ? dueText : fmtCountdown(left);
}

function countdownMarkup(unix, dueText, label) {
  return '<span data-reset-at="' + Number(unix) + '" data-due-text="' + escapeHtml(dueText) +
    '" data-countdown-label="' + escapeHtml(label) + '"></span>';
}

function updateCountdowns() {
  for (const el of document.querySelectorAll('[data-reset-at]')) {
    el.textContent = countdownValue(Number(el.dataset.resetAt), el.dataset.dueText);
    el.setAttribute('aria-label', el.dataset.countdownLabel + '：' + el.textContent);
  }
}

function render(snap) {
  latest = snap;
  clockEl.textContent = fmtClock(snap.at);
  clockEl.title = "畫面更新於 " + fmtClock(snap.at) + "；不代表各來源剛完成查詢";
  document.getElementById('host').textContent = snap.host;
  document.getElementById('scan').textContent = '掃描 ' + snap.scan_ms + ' ms';

  const now = snap.at;
  rowsEl.innerHTML = '';
  for (const p of (snap.providers || [])) {
    rowsEl.appendChild(buildRow(p, now, editing === p.id));
  }
  if (!snap.providers || !snap.providers.length) rowsEl.innerHTML = '<div class="empty">未偵測到已安裝的 AI agent</div>';
  updateCountdowns();
}

function buildRow(p, now, keepEditor) {
  const row = document.createElement('div');
  row.className = 'row';
  row.style.setProperty('--agent', agentColors[p.id] || '#69A9EF');

  // has_limit 由後端決定：可能是手動上限，也可能是紀錄裡的官方回報百分比。
  const hasLimit = !!p.has_limit;
  const grouped = p.id === 'cursor' && p.limit_source !== 'manual';
  let level = '';
  if (!grouped && hasLimit && p.percent >= 1) level = 'crit';
  else if (!grouped && hasLimit && p.percent >= p.warn_ratio) level = 'warn';

  const iconOff = p.status !== 'ok' && p.status !== 'manual' && p.status !== 'idle';

  // 標題列：百分比是主角，用量／總量是它的註腳
  const head = document.createElement('div');
  head.className = 'head';
  head.innerHTML =
    providerIcon(p.id, iconOff) +
    '<div class="title">' +
      '<div class="title-line"><span class="name"></span><span class="reset-countdown"></span></div>' +
      '<div class="window"></div>' +
    '</div>' +
    '<div class="readout">' +
      '<div class="pct"></div>' +
      '<div class="amounts"></div>' +
    '</div>';
  head.querySelector('.name').textContent = agentNames[p.id] || p.name;
  head.querySelector('.name').title = p.name;
  head.querySelector('.window').textContent = p.window_label;
  const resetEl = head.querySelector('.reset-countdown');
  if (p.quota_reset_at) {
    resetEl.innerHTML = '重置 ' + countdownMarkup(p.quota_reset_at, '等待更新', '帳號額度重置倒數');
    resetEl.title = '帳號額度重置倒數';
  } else {
    resetEl.classList.add('unknown');
    resetEl.textContent = '重置未知';
    resetEl.title = '來源未提供帳號額度重置時間';
  }

  const pctEl = head.querySelector('.pct');
  const amtEl = head.querySelector('.amounts');
  if (grouped) {
    pctEl.className = 'group-note';
    pctEl.textContent = '分項用量';
    pctEl.title = '兩個額度池分別計算，不合併為單一百分比';
  } else if (hasLimit) {
    pctEl.className = 'pct ' + level;
    pctEl.innerHTML = fmtPct(p.percent) + '<span class="sign">%</span>';
    pctEl.title = '用量 ÷ 總量';
  } else {
    pctEl.className = 'pct none';
    // 保留 % 記號，讓這個位置一眼看得出是「百分比還算不出來」，
    // 而不是一條莫名其妙的橫線。
    pctEl.innerHTML = '—<span class="sign">%</span>';
    pctEl.title = p.id === 'antigravity' ? '尚未取得 Antigravity 額度' : '尚未設定上限，算不出百分比';
  }

  const used = fmtNum(p.used, p.metric);
  const unit = metricWord(p.metric);
  if (grouped && !hasLimit) {
    amtEl.textContent = '模型池各自計量；尚無可用方案總額';
  } else if (hasLimit && p.show_limit) {
    amtEl.innerHTML = escapeHtml(used) + '<span class="sep">/</span>' +
      escapeHtml(fmtNum(p.limit, p.metric)) + ' <span class="unit">' + unit + '</span>';
  } else if (hasLimit && p.id === 'antigravity') {
    amtEl.textContent = '模型群額度；主數字為使用比例最高的限制';
  } else if (hasLimit && p.id === 'cursor') {
    amtEl.textContent = '方案額度（未提供金額上限）';
  } else if (hasLimit && p.id === 'claude' && !p.last_event_at) {
    amtEl.textContent = '帳號額度；未提供 token 總量';
  } else if (hasLimit) {
    // 官方只回報百分比、沒給絕對上限。這裡的數字是我們自己數的 token，
    // 跟上面那個百分比不是同一個單位，所以要講清楚是本機統計。
    amtEl.innerHTML = '<span class="unit">本機累計</span> ' + escapeHtml(used) +
      ' <span class="unit">' + unit + '</span>';
  } else {
    amtEl.innerHTML = p.id === 'antigravity' ? '等待額度資料' : escapeHtml(used) + ' <span class="unit">' + unit + '，尚未設定上限</span>';
  }
  row.appendChild(head);

  // 進度條
  const track = document.createElement('div');
  track.className = 'track' + (hasLimit ? '' : ' unset');
  if (hasLimit) {
    const fill = document.createElement('div');
    fill.className = 'fill ' + level;
    fill.style.width = Math.min(p.percent * 100, 100) + '%';
    track.appendChild(fill);
    const marker = document.createElement('div');
    marker.className = 'marker';
    marker.style.left = (p.warn_ratio * 100) + '%';
    marker.title = '警戒線 ' + Math.round(p.warn_ratio * 100) + '%';
    track.appendChild(marker);
  }
  if (!grouped) row.appendChild(track);
  amtEl.title = amtEl.textContent;
  row.appendChild(amtEl);
  if (p.id === 'cursor') row.appendChild(buildUsageGroups(p));

  const details = document.createElement("div");
  details.className = "details";
  details.id = "details-" + p.id;
  details.hidden = !expanded.has(p.id);

  row.tabIndex = 0;
  row.setAttribute("role", "button");
  row.setAttribute("aria-controls", details.id);
  row.title = "點一下展開或收合詳細資訊";
  const syncState = () => {
    row.setAttribute("aria-expanded", String(!details.hidden));
    row.classList.toggle("expanded", !details.hidden);
  };
  const toggleDetails = () => {
    details.hidden = !details.hidden;
    if (details.hidden) { expanded.delete(p.id); if (editing === p.id) editing = null; }
    else expanded.add(p.id);
    syncState();
  };
  row.addEventListener("click", e => {
    if (e.target.closest(DRAG_EXEMPT)) return;
    if (windowWasDragged(e)) return;
    toggleDetails();
  });
  row.addEventListener("keydown", e => {
    if (e.key !== "Enter" && e.key !== " ") return;
    if (e.target !== row) return;
    e.preventDefault();
    toggleDetails();
  });
  syncState();
  row.appendChild(details);

  // 下方資訊列
  const meta = document.createElement('div');
  meta.className = 'meta';
  const bits = [];

  const bit = (label, value) =>
    bits.push('<span class="bit"><span class="label">' + escapeHtml(label) + '</span><b>' + value + '</b></span>');

  if (p.window_label) bit('計量視窗', escapeHtml(p.window_label));
  if (grouped && hasLimit) {
    bit('方案總用量（非各模型池）', fmtPct(p.percent) + '%');
  } else if (hasLimit && p.percent > 1) {
    bit('已超出上限', fmtPct(p.percent - 1) + '%');
  } else if (hasLimit) {
    bit('剩餘', fmtPct(1 - p.percent) + '%' +
      (p.show_limit ? '（' + fmtNum(Math.max(p.limit - p.used, 0), p.metric) + ' ' + unit + '）' : ''));
  }
  if (p.reset_at) bit(p.reset_label, countdownMarkup(p.reset_at,
    p.quota_reset_at === p.reset_at ? '等待更新' : '已到期', p.reset_label + '倒數'));
  if (p.rate_per_min > 0) bit('速率', fmtNum(p.rate_per_min * 60, p.metric) + ' / 小時');
  if (p.exhaust_in_sec) bit('依此速率', fmtLeft(p.exhaust_in_sec) + '後達 100%');
  if (p.today > 0 && p.window_label.indexOf('今日') < 0) {
    bit('今日', fmtNum(p.today, p.metric) + ' ' + unit);
  }
  // 另一道限制（例如 Codex 的 7 天窗）。進度條只畫得下一個，其餘放這裡。
  if (p.other_limits) {
    for (const w of p.other_limits) {
      let v = fmtPct(w.percent) + '%';
      if (w.reset_at) v += '，重置 ' + countdownMarkup(w.reset_at, '等待更新', (w.label || '另一道') + '限額重置倒數');
      bit((w.label || '另一道') + '限額', v);
    }
  }
  for (const g of (p.id === 'cursor' ? (p.usage_groups || []) : [])) {
    if (g.used != null && g.limit != null) {
      bit(g.label, escapeHtml(fmtNum(g.used, 'usd') + ' / ' + fmtNum(g.limit, 'usd') + ' USD'));
    }
  }
  if (p.limit_source === 'reported') bit('來源', escapeHtml(p.quota_source || '官方回報值'));
  if (p.quota_at) bit('額度更新', escapeHtml(new Date(p.quota_at * 1000).toLocaleString('zh-Hant', {hour12: false})));
  if (p.quota_stale) bit('資料較舊', '請檢查來源登入及更新狀態；超過 24 小時不再用於計算');
  if (bits.length) {
    meta.innerHTML = bits.join('');
    if (level === 'crit') meta.className = 'meta over';
    else if (level) meta.className = 'meta alert';
    details.appendChild(meta);
  }

  // 模型分佈
  if (p.models && p.models.length && p.status === 'ok') {
    const m = document.createElement('div');
    m.className = 'models';
    m.innerHTML = p.models.map(x =>
      '<span>' + escapeHtml(x.model) + ' ' + fmtNum(p.metric === 'requests' ? x.requests : x.tokens, p.metric) + '</span>'
    ).join('');
    details.appendChild(m);
  }

  // 狀態說明與可操作的下一步
  if (p.status === 'unavailable') {
    const h = document.createElement('div');
    h.className = 'hint';
    h.innerHTML = escapeHtml(p.detail || '找不到紀錄資料夾') +
      '<div class="path">' + (p.roots || []).map(escapeHtml).join('<br>') + '</div>';
    details.appendChild(h);
  } else if (p.status === 'no_data' || p.status === 'idle' || p.status === 'disabled') {
    const h = document.createElement('div');
    h.className = 'hint';
    h.textContent = p.detail + (p.files ? '（已讀 ' + p.files + ' 個檔案）' : '');
    details.appendChild(h);
  }
  if (p.errors && p.errors.length) {
    const h = document.createElement('div');
    h.className = 'hint';
    h.textContent = '讀取問題：' + p.errors[0];
    details.appendChild(h);
  }

  // 上限設定
  details.appendChild(buildLimitForm(p, keepEditor, hasLimit));
  return row;
}

function buildUsageGroups(p) {
  const wrap = document.createElement('div');
  wrap.className = 'usage-groups';
  wrap.setAttribute('aria-label', 'Cursor 模型用量');
  const groups = p.usage_groups || [];
  for (const [id, label] of [['cursor-model', 'Cursor model'], ['other-model', 'Other model']]) {
    const group = groups.find(g => g.id === id);
    const percent = group?.percent;
    const known = p.status !== 'disabled' && p.limit_source === 'reported' &&
      typeof percent === 'number' && Number.isFinite(percent) && percent >= 0;
    const level = known ? (percent >= 1 ? 'crit' : percent >= p.warn_ratio ? 'warn' : '') : 'none';
    const item = document.createElement('div');
    item.className = 'usage-group';
    item.dataset.group = id;
    const heading = document.createElement('div');
    heading.className = 'group-heading';
    const name = document.createElement('span');
    name.textContent = label;
    const value = document.createElement('span');
    value.className = 'group-percent ' + level;
    value.textContent = known ? fmtPct(percent) + '%' : '—%';
    heading.append(name, value);
    item.appendChild(heading);
    const track = document.createElement('div');
    track.className = 'track' + (known ? '' : ' unset');
    track.setAttribute('role', 'progressbar');
    track.setAttribute('aria-label', label + ' 已使用');
    if (known) {
      track.setAttribute('aria-valuemin', '0');
      track.setAttribute('aria-valuemax', '100');
      track.setAttribute('aria-valuenow', String(Math.min(percent * 100, 100)));
      track.setAttribute('aria-valuetext', fmtPct(percent) + '% 已使用');
      const fill = document.createElement('div');
      fill.className = 'fill ' + level;
      fill.style.width = Math.min(percent * 100, 100) + '%';
      track.appendChild(fill);
    } else {
      track.setAttribute('aria-valuetext', '尚無分項資料');
    }
    item.appendChild(track);
    if (!known || (group.used != null && group.limit != null)) {
      const note = document.createElement('div');
      note.className = 'group-note';
      note.textContent = known ? fmtNum(group.used, 'usd') + ' / ' + fmtNum(group.limit, 'usd') + ' USD' :
        p.status === 'disabled' ? '已停用' : p.limit_source === 'manual' ? '手動總額不含分項資料' : '尚無分項資料';
      item.appendChild(note);
    }
    wrap.appendChild(item);
  }
  if (p.quota_stale) {
    const note = document.createElement('div');
    note.className = 'group-note';
    note.textContent = '額度資料較舊，請重新掃描或檢查登入';
    wrap.appendChild(note);
  }
  return wrap;
}

function buildLimitForm(p, keepEditor, hasLimit) {
  const wrap = document.createElement('form');
  wrap.className = 'limit';
  wrap.onsubmit = e => e.preventDefault();

  const manualSource = p.id === 'cursor';

  if (p.id === 'antigravity') {
    const note = document.createElement('span');
    note.textContent = '請保持 Antigravity CLI 或 Desktop 開啟並登入；各模型群的額度不相加。';
    wrap.appendChild(note);
    return wrap;
  }

  if (!keepEditor) {
    const btn = document.createElement('button');
    btn.type = 'button';
    if (p.limit_source === 'unset') {
      btn.textContent = manualSource ? '填入後台看到的數字' : '設定上限';
      if (!hasLimit) btn.className = 'cta';
    } else if (p.limit_source === 'reported') {
      btn.textContent = '改用手動上限';
    } else {
      btn.textContent = '調整上限';
    }
    btn.onclick = () => { editing = p.id; render(latest); };
    wrap.appendChild(btn);
    if (!hasLimit && !manualSource) {
      const s = document.createElement('span');
      s.textContent = '填入上限後這裡就會顯示百分比';
      wrap.appendChild(s);
    }
    if (p.note && p.limit_source === 'unset') {
      const n = document.createElement('div');
      n.className = 'hint';
      n.textContent = p.note;
      wrap.appendChild(n);
    }
    return wrap;
  }

  const usedInput = document.createElement('input');
  usedInput.type = 'number';
  usedInput.min = '0';
  usedInput.placeholder = '已用';
  usedInput.value = manualSource && p.used ? p.used : '';

  const limitInput = document.createElement('input');
  limitInput.type = 'number';
  limitInput.min = '0';
  limitInput.placeholder = '上限（' + metricWord(p.metric) + '）';
  limitInput.value = p.limit || '';

  if (manualSource) {
    const l1 = document.createElement('span'); l1.textContent = '已用';
    wrap.appendChild(l1); wrap.appendChild(usedInput);
  }
  const l2 = document.createElement('span'); l2.textContent = '上限';
  wrap.appendChild(l2); wrap.appendChild(limitInput);

  const save = document.createElement('button');
  save.type = 'button';
  save.textContent = '儲存';
  save.onclick = async () => {
    const body = { provider: p.id, limit: Number(limitInput.value) || 0 };
    if (manualSource) body.used = Number(usedInput.value) || 0;
    await fetch('api/limit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    editing = null;
    refresh();
  };
  wrap.appendChild(save);

  const cancel = document.createElement('button');
  cancel.type = 'button';
  cancel.textContent = '取消';
  cancel.onclick = () => { editing = null; render(latest); };
  wrap.appendChild(cancel);

  limitInput.addEventListener('keydown', e => { if (e.key === 'Enter') save.click(); });
  usedInput.addEventListener('keydown', e => { if (e.key === 'Enter') save.click(); });
  setTimeout(() => (manualSource ? usedInput : limitInput).focus(), 0);
  return wrap;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

async function refresh() {
  try {
    const r = await fetch('api/snapshot');
    render(await r.json());
  } catch (e) {
    clockEl.textContent = '連線中斷';
  }
}

document.getElementById("rescan").onclick = async () => {
  clockEl.textContent = "掃描中";
  await fetch("api/rescan", { method: "POST" });
  setTimeout(refresh, 600);
};


// 即時更新：SSE 斷線就退回輪詢
function connect() {
  const es = new EventSource('api/stream');
  es.onmessage = e => {
    if (editing) return;          // 使用者正在輸入，先不重繪
    render(JSON.parse(e.data));
  };
  es.onerror = () => {
    es.close();
    clockEl.textContent = '重新連線中';
    setTimeout(connect, 3000);
  };
}

// 空白處按住就能搬視窗。只在按下時通知一次，之後由本機服務追游標移動，
// 每個 mousemove 打一次請求跟不上手感。
const DRAG_EXEMPT = "button, input, select, textarea, a, label, .details";
let dragRequested = false;
let pressedAt = null;
document.addEventListener("mousedown", e => {
  if (e.button !== 0) return;
  if (e.target.closest(DRAG_EXEMPT)) return;
  pressedAt = {x: e.screenX, y: e.screenY};
  if (dragRequested) return;
  e.preventDefault();  // 不要順便開始選取文字
  dragRequested = true;
  fetch("api/window/drag", {method: "POST"})
    .catch(() => {})
    .finally(() => { dragRequested = false; });
});

// 拖完放開滑鼠一樣會發出 click。視窗跟著游標走，所以 clientX/Y 不變，要看 screenX/Y。
function windowWasDragged(e) {
  if (!pressedAt) return false;
  const moved = Math.abs(e.screenX - pressedAt.x) + Math.abs(e.screenY - pressedAt.y);
  pressedAt = null;
  return moved > 4;
}

refresh();
connect();
setInterval(updateCountdowns, 1000);
document.addEventListener("visibilitychange", updateCountdowns);
</script>
</body>
</html>
