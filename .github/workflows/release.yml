name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build release binaries
        run: sh scripts/release.sh

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          release_dir="dist/releases"
          assets_dir="$release_dir/assets"
          mkdir -p "$assets_dir"
          for target in windows-amd64 windows-arm64 linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            tar -czf "$assets_dir/aiusage-${RELEASE_TAG}-${target}.tar.gz" \
              -C "$release_dir" "$target"
          done
          cp "$release_dir/BUILDINFO.txt" "$release_dir/SHA256SUMS" "$assets_dir/"
          (
            cd "$assets_dir"
            sha256sum aiusage-*.tar.gz > SHA256SUMS
          )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/releases/assets/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/releases/assets/* \
              --title "aiusage $RELEASE_TAG" \\
              --generate-notes
          fi
