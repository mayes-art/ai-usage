name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Create or update release PR
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Check out released source
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - name: Set up Go
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test, vet, and build release binaries
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: sh scripts/release.sh

      - name: Package release assets
        if: ${{ steps.release.outputs.release_created == 'true' }}
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          release_dir="dist/releases"
          assets_dir="$release_dir/assets"
          mkdir -p "$assets_dir"
          for target in windows-amd64 windows-arm64 linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            tar -czf "$assets_dir/aiusage-${RELEASE_TAG}-${target}.tar.gz" \
              -C "$release_dir" "$target"
          done
          cp "$release_dir/BUILDINFO.txt" "$assets_dir/"
          cp "$release_dir/SHA256SUMS" "$assets_dir/BINARY-SHA256SUMS"
          (
            cd "$assets_dir"
            sha256sum aiusage-*.tar.gz > SHA256SUMS
          )

      - name: Attach assets and publish release
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" dist/releases/assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
