name: Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-pr:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Create or update release PR
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-release:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
    runs-on: ubuntu-latest
    steps:
      - name: Check out merged release PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          version="$(jq -r '."."' .release-please-manifest.json)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test, vet, and build release binaries
        run: sh scripts/release.sh

      - name: Package release assets
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          release_dir="dist/releases"
          assets_dir="$release_dir/assets"
          mkdir -p "$assets_dir"
          for target in windows-amd64 windows-arm64 linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            tar -czf "$assets_dir/aiusage-${RELEASE_TAG}-${target}.tar.gz" \
              -C "$release_dir" "$target"
          done
          cp "$release_dir/BUILDINFO.txt" "$assets_dir/"
          cp "$release_dir/SHA256SUMS" "$assets_dir/BINARY-SHA256SUMS"
          (
            cd "$assets_dir"
            sha256sum aiusage-*.tar.gz > SHA256SUMS
          )

      - name: Prepare release notes
        shell: bash
        run: jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/release-notes.md"

      - name: Create or repair GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/releases/assets/* --clobber
            gh release edit "$RELEASE_TAG" --draft=false
          else
            gh release create "$RELEASE_TAG" dist/releases/assets/* \
              --target "$RELEASE_SHA" \
              --title "aiusage $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
